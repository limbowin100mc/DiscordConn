<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Now playing</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 640px; height: 240px; overflow: hidden; background: #0b0d12; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #fff; }
    .card { position: relative; width: 640px; height: 240px; overflow: hidden; display: flex; align-items: center; gap: 24px; padding: 24px; }
    .bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(48px) saturate(1.6) brightness(0.55); }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8, 10, 14, 0.35), rgba(8, 10, 14, 0.75)); }
    .cover { position: relative; flex: none; width: 192px; height: 192px; border-radius: 18px; object-fit: cover; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5); background: #151922; }
    .info { position: relative; min-width: 0; flex: 1; display: flex; flex-direction: column; height: 192px; }
    .head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, 0.75); }
    .head img { width: 22px; height: 22px; border-radius: 6px; }
    .title { margin-top: 12px; font-size: 28px; font-weight: 700; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sub { margin-top: 6px; font-size: 17px; color: rgba(255, 255, 255, 0.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress { margin-top: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255, 255, 255, 0.7); font-variant-numeric: tabular-nums; }
    .bar { position: relative; flex: 1; height: 5px; border-radius: 5px; background: rgba(255, 255, 255, 0.22); overflow: hidden; }
    .bar i { position: absolute; inset: 0 auto 0 0; background: #fff; border-radius: 5px; }
    .foot { margin-top: 12px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255, 255, 255, 0.55); }
    .foot img { width: 14px; height: 14px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card" id="card"></div>
  <script src="share.js"></script>
</body>
</html>
