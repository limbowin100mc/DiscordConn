<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Presence Hub mini player</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #eceef3; }
    .card {
      position: absolute; inset: 4px; border-radius: 16px; overflow: hidden;
      background: rgba(16, 19, 26, 0.94); border: 1px solid rgba(255, 255, 255, 0.09);
      display: flex; gap: 12px; padding: 10px 12px 10px 10px; align-items: center;
      -webkit-app-region: drag;
    }
    .glow { position: absolute; inset: -30px; background-size: cover; background-position: center; filter: blur(34px) saturate(1.5); opacity: 0.35; pointer-events: none; }
    .art { position: relative; flex: none; width: 80px; height: 80px; }
    .art img.big { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; background: #0d1016; }
    .art img.logo { position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; border-radius: 7px; border: 2px solid #12151c; background: #12151c; }
    .info { position: relative; min-width: 0; flex: 1; }
    .head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9aa3b5; font-weight: 600; }
    .head .x { margin-left: auto; }
    .title { margin-top: 2px; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { color: #b6bccb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .bar { position: relative; flex: 1; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
    .bar i { position: absolute; inset: 0 auto 0 0; background: #fff; border-radius: 4px; transition: width 1s linear; }
    .time { font-size: 11px; color: #9aa3b5; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .controls { display: flex; gap: 2px; -webkit-app-region: no-drag; }
    button { -webkit-app-region: no-drag; border: 0; background: transparent; color: #dfe3ec; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; padding: 0; }
    button:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    button svg { width: 16px; height: 16px; }
    button.play svg { width: 18px; height: 18px; }
    .x button { width: 22px; height: 22px; }
    .x button svg { width: 12px; height: 12px; }
    .flash { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #232937; padding: 6px 12px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .flash.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card" id="card"></div>
  <div class="flash" id="flash"></div>
  <script src="mini.js"></script>
</body>
</html>
